services:
  node_gateway:
    image: flor3473/energia:node_gateway
    ports:
      - "3000:3000"
    env_file:
      - ./node_gateway/.env

  python_service:
    image: flor3473/energia:python_service
    ports:
      - "8000:8000"

  frontend:
    image: flor3473/energia:frontend
    ports:
      - "4200:4200"
    depends_on:
      - node_gateway

  assistant:
    image: flor3473/energia:assistant
    ports:
      - "3002:3002"
    env_file:
      - ./assistant/.env
    depends_on:
      - ollama
      
  ollama:
    image: ollama/ollama
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ./ollama:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
