<button class="chatbot-button" type="button" aria-label="Ouvrir l'assistant IA" (click)="toggleChat()">
  🤖
</button>

@if (isOpen) {
  <div class="chatbot-panel">
    <div class="chatbot-header">
      <span>🤖 Assistant EnergIA</span>
      <button type="button" aria-label="Fermer l'assistant" (click)="toggleChat()">✕</button>
    </div>

    <div class="chatbot-messages">
        <div class="chatbot-messages">
            @for (message of messages; track $index) {
                <div class="message" [class.user-message]="message.role === 'user'" [class.assistant-message]="message.role === 'assistant'">
                <div class="message-content">{{ message.content }}</div>
                </div>
            }
            @if (isLoading) {
                <div class="message assistant-message thinking-message">
                  <div class="thinking-dots">
                    <span></span>
                    <span></span>
                    <span></span>
                  </div>
                  <span>Réflexion en cours...</span>
                </div>
            }
        </div>
    </div>

    <div class="chatbot-input">
      <input type="text" placeholder="Écrivez votre question..." [(ngModel)]="messageInput" />
      
      <button type="button" aria-label="Envoyer le message" (click)="sendMessage()">➤</button>
    </div>
  </div>
}
